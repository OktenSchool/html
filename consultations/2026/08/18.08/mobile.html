<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .flex{
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 100px 0;
            flex-direction: row;
        }
        .item{
            width: 200px;
            height: 200px;
            background: darkolivegreen;
            border-radius: 10%;
        }
        @media screen and (max-width: 480px) {
            .flex{
                flex-direction: column;
                gap: 50px;
            }
        }

    </style>
</head>
<body>
    <div class="flex">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
