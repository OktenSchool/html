<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        *{
            outline: 1px solid red;
        }
        :root{
            --main-color: rgba(252, 170, 56, 0.7);
            --text-color: #332523;
            --border-radius: 20px;
        }
        section{
            background: var(--main-color);
            border-radius: var(--border-radius);
            padding: 20px 10px;
            margin:  20px 0;
        }
        p{
            color: var(--text-color);
        }

        button{
            margin: 100px;
            width: 100px;
            height: 40px;
            background: lightpink;
            border: 2px solid lightsalmon;
            border-radius: 4px;
            color: #5b4238;
            font-size: 16px;
            animation:  pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {

            0%{
                transform: scale(1);
                box-shadow: 0 0 0 rgba(0, 0, 0, 0);

            }
            50%{
                transform: scale(1.1);
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.27);
            }
            100%{
                transform: scale(1);
                box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            }

        }
    </style>
</head>
<body>
<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="">

<section>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Asperiores dignissimos dolorem id inventore ipsum non
        vel. Accusamus accusantium cumque delectus temporibus voluptates! Adipisci alias asperiores quod reprehenderit
        sed temporibus voluptatum.</p>
</section>

<button> button </button>



</body>
</html>
