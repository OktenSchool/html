        .cards{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 300px;
            height: 300px;
            border: 2px solid;
            position: relative;
        }
        .card1{
            background: lightskyblue;
            right: -100px;
            z-index: 2;
            transition: 2s;
        }
        .card2{
            background-color: coral;
        }
        img{
            width: 300px;
            margin: 100px;
        }
        .card1:hover{
            background: limegreen;
        }
        p{
            font-family: "Libertinus Serif", serif;
            font-weight: 400;
            font-style: normal;
        }

    </style>
</head>
<body>

<div class="cards">
    <div class="card card1"></div>
    <div class="card card2"></div>
</div>
