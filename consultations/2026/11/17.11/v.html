<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        header{
            width: 100vw;
            height: 30vh;
            background: lightgrey;
        }
        footer{
            width: 100vw;
            height: 30vh;
            background: lightcyan;
        }
        main{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .left{
            height: 40vh;
            width: 25vw;
            background: lightblue;
        }
        .center{
            height: 40vh;
            width: 50vw;
            background: lightgreen;
        }
        .right{
            height: 40vh;
            width: 25vw;
            background: lightpink;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header></header>
        <main>
            <section class="left"></section>
            <section class="center"></section>
            <section class="right"></section>
        </main>
        <footer></footer>
    </div>
</body>
</html>
