<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        *{
            margin: 0;

        }
        .items{
            width: 100%;
            height: 600px;
            background: #926513;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;

        }
        .item{
            width: 100px;
            height: 100px;
            border: 1px solid #4d320f;
            background-image: url('https://i.guim.co.uk/img/media/092ee6463c71fa2874f8a4e4247487b30c0cdace/219_0_1284_1027/master/1284.jpg?width=1200&height=1200&quality=85&auto=format&fit=crop&s=38d65c0522a1daf7a39095bf552fedfa');
            background-size: cover;
        }
        .cards{
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 100px 0;
        }
        .card{
            width: 30%;
            height: 200px;
            background: khaki;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card img{
            width: 80%;
        }
        @media screen and (max-width: 480px){
            .cards{
                flex-direction: column;
            }
            .card{
                width: 90%;
                margin-top: 50px;
            }
        }

    </style>
</head>
<body>
<div class="items">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
</div>
<div class="cards">
    <div class="card">
        <img src="https://marketplace.canva.com/Pk_Vc/MAFsWnPk_Vc/1/tl/canva-red-apple-fruit-MAFsWnPk_Vc.png" alt="">
    </div>
    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Banana.png?utm_source=uk.wikipedia.org&utm_campaign=index&utm_content=original" alt="">
    </div>
    <div class="card">
        <img src="https://png.pngtree.com/png-clipart/20250218/original/pngtree-a-single-juicy-pineapple-fruit-png-image_19849323.png" alt="">
    </div>
</div>
</body>
</html>
