<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap');
       *{
           margin: 0;
           padding: 0;
       }
        section.cards{
            width: 1070px;
            margin: 100px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card{
            width: 307px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card h4{
            color: #19191B;
            text-align: center;
            font-family: "DM Sans", sans-serif;
            font-size: 24px;
            font-style: normal;
            font-weight: 700;
            line-height: 36px; /* 150% */
            letter-spacing: -0.75px;
            margin: 7px 0 20px 0;
        }
        .card p{
            color: #696871;
            text-align: center;
            font-family: Mulish, sans-serif;
            font-size: 16px;
            font-style: normal;
            font-weight: 400;
            line-height: 24px; /* 150% */
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>
    <section class="cards">
        <div class="card">
            <img src="Icon1.svg" alt="icon">
            <h4>Benchmarks</h4>
            <p>See how you stack up against comparable companies in similar stages.</p>
        </div>
        <div class="card">
            <img src="Icon%20002.svg" alt="icon">
            <h4>Pricing Audit</h4>
            <p>Benchmark the health of your monetization and pricing strategy.</p>
        </div>
        <div class="card">
            <img src="Icon%20003.svg" alt="icon">
            <h4>Retention Audit</h4>
            <p>Audit where revenue leakage exists and where you can increase retention.</p>
        </div>

    </section>
</body>
</html>
